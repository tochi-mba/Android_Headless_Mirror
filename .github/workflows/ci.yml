name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build, test and package (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build (warnings are errors)
        run: dotnet build Rex.sln -c Release

      - name: Test
        run: dotnet test --project tests/Rex.Tests/Rex.Tests.csproj -c Release --no-build

      - name: Build the installer
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./installer/build.ps1 -Version 0.0.${{ github.run_number }}

      - name: Smoke test the published CLI
        shell: pwsh
        run: |
          $env:REX_ROOT = (Get-Location).Path
          & dist/rex/rex.exe help
          if ($LASTEXITCODE -ne 0) { throw "rex help failed." }

          $json = & dist/rex/rex.exe agent capabilities
          if ($LASTEXITCODE -ne 0) { throw "rex agent capabilities failed." }
          $lines = @($json | Where-Object { $_ -ne "" })
          if ($lines.Count -ne 1) { throw "Machine mode must emit exactly one line." }
          $doc = $lines[0] | ConvertFrom-Json
          if (-not $doc.ok -or $doc.protocolVersion -ne 2) { throw "Machine protocol contract failed." }

          $status = (& dist/rex/rex.exe --json status) | ConvertFrom-Json
          if ($status.ok -ne $true -or $status.data.setupComplete -ne $true) { throw "rex --json status failed." }

      - name: Upload the installer and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-and-screens
          path: |
            dist/AndroidHeadlessMirror-Setup.exe
            dist/AndroidHeadlessMirror-Setup.exe.sha256
            artifacts/screens/
          if-no-files-found: ignore
          retention-days: 14

  pages:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
