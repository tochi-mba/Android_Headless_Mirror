name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-tests:
    name: Windows package contracts + behavior
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Validate JSON files
        shell: pwsh
        run: |
          Get-Content config.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content docs/site.webmanifest -Raw | ConvertFrom-Json | Out-Null
          Get-Content package.json -Raw | ConvertFrom-Json | Out-Null

      - name: Validate Control Center XAML
        shell: powershell
        run: |
          [xml](Get-Content ControlCenter.xaml -Raw) | Out-Null
          Add-Type -AssemblyName PresentationFramework
          Add-Type -AssemblyName WindowsBase
          [xml]$xaml = Get-Content ControlCenter.xaml -Raw
          $reader = New-Object System.Xml.XmlNodeReader $xaml
          $window = [Windows.Markup.XamlReader]::Load($reader)
          if ($null -eq $window) { throw "ControlCenter.xaml did not load." }
          $window.Close()

      - name: Validate every PowerShell file parses
        shell: pwsh
        run: |
          $failed = $false

          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null

            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              Write-Host "Syntax errors in $($_.FullName)" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_ }
              $failed = $true
            }
          }

          if ($failed) {
            exit 1
          }

      - name: Verify launcher references
        shell: pwsh
        run: |
          $required = @(
            "REX.bat",
            "Bootstrap-RexCli.ps1",
            "RexBridge.ps1",
            "Setup.ps1",
            "Start-PhoneMirror.ps1",
            "Stop-PhoneMirror.ps1",
            "PatternOverlay.ps1",
            "MirrorChrome.ps1",
            "ControlCenter.ps1",
            "ControlCenter.xaml",
            "DeviceControl.ps1",
            "ScrcpyControl.ps1",
            "Reset-LockScreenChoices.ps1",
            "RESET_LOCK_SCREEN_CHOICES.bat",
            "Start-Hidden.vbs",
            "Diagnostics.ps1",
            "Install-Autostart.ps1",
            "Remove-Autostart.ps1",
            "SETUP_AND_START.bat",
            "START_NOW.bat",
            "START_WITH_LOG.bat",
            "STOP.bat",
            "DIAGNOSTICS.bat",
            "REMOVE_AUTOSTART.bat",
            "src\Rex.AndroidMirror.Cli\Rex.AndroidMirror.Cli.csproj",
            "src\Rex.AndroidMirror.Cli\Program.cs",
            "tests\Rex.AndroidMirror.Cli.Tests\Rex.AndroidMirror.Cli.Tests.csproj",
            "tests\Test-RexCliBootstrap.ps1"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Missing required file: $file"
            }
          }

      - name: Run repository contract tests
        run: python tests\test_package.py

      - name: Restore REX CLI tests
        run: dotnet restore tests\Rex.AndroidMirror.Cli.Tests\Rex.AndroidMirror.Cli.Tests.csproj

      - name: Build REX CLI with warnings as errors
        run: dotnet build tests\Rex.AndroidMirror.Cli.Tests\Rex.AndroidMirror.Cli.Tests.csproj -c Release --no-restore

      - name: Run REX CLI unit and interactive tests
        shell: pwsh
        run: |
          dotnet test tests\Rex.AndroidMirror.Cli.Tests\Rex.AndroidMirror.Cli.Tests.csproj -c Release --no-build --logger "trx;LogFileName=rex-cli.trx"
          if ($LASTEXITCODE -ne 0) { throw "REX CLI test runner failed." }

          $trxPath = "tests\Rex.AndroidMirror.Cli.Tests\TestResults\rex-cli.trx"
          if (-not (Test-Path $trxPath)) { throw "REX CLI TRX result file was not produced." }

          [xml]$trx = Get-Content $trxPath -Raw
          $total = [int]$trx.TestRun.ResultSummary.Counters.total
          $passed = [int]$trx.TestRun.ResultSummary.Counters.passed
          $failed = [int]$trx.TestRun.ResultSummary.Counters.failed

          Write-Host "REX CLI tests: total=$total passed=$passed failed=$failed"

          if ($total -le 0) { throw "REX CLI test discovery returned zero tests." }
          if ($failed -ne 0) { throw "REX CLI test suite reported failures." }

      - name: Run REX CLI bootstrap behavior
        shell: powershell
        run: .\tests\Test-RexCliBootstrap.ps1

      - name: Run REX bridge fake-ADB E2E
        shell: powershell
        run: .\tests\Test-RexBridgeE2E.ps1

      - name: Publish self-contained REX CLI
        shell: pwsh
        run: |
          dotnet publish src\Rex.AndroidMirror.Cli\Rex.AndroidMirror.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts\rex-cli
          if (-not (Test-Path artifacts\rex-cli\rex.exe)) { throw "rex.exe was not produced." }
          if ((Get-ChildItem artifacts\rex-cli -Filter *.dll -File).Count -gt 0) { throw "Single-file publish unexpectedly emitted DLL dependencies." }

      - name: Smoke test published REX CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts\rex-cli-smoke | Out-Null
          $env:REX_AHM_ROOT = (Get-Location).Path

          & .\artifacts\rex-cli\rex.exe help | Tee-Object artifacts\rex-cli-smoke\help.txt
          if ($LASTEXITCODE -ne 0) { throw "rex help failed." }

          & .\artifacts\rex-cli\rex.exe status | Tee-Object artifacts\rex-cli-smoke\status.txt
          if ($LASTEXITCODE -ne 0) { throw "rex status failed." }

          & .\artifacts\rex-cli\rex.exe config get MaxFps | Tee-Object artifacts\rex-cli-smoke\config-get.txt
          if ($LASTEXITCODE -ne 0) { throw "rex config get failed." }

          & .\artifacts\rex-cli\rex.exe config list --filter MirrorChrome | Tee-Object artifacts\rex-cli-smoke\config-list.txt
          if ($LASTEXITCODE -ne 0) { throw "rex config list failed." }

          $help = Get-Content artifacts\rex-cli-smoke\help.txt -Raw
          if ($help -notmatch "REX" -or $help -notmatch "TECHNOLOGIES" -or $help -notmatch "Advanced") {
            throw "REX CLI help output is missing expected brand/capability content."
          }

      - name: Upload REX CLI and terminal smoke artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: rex-cli-windows
          path: |
            artifacts/rex-cli/rex.exe
            artifacts/rex-cli-smoke/
            tests/Rex.AndroidMirror.Cli.Tests/TestResults/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run executable behavior tests (PowerShell 7)
        shell: pwsh
        run: ./tests/Test-PowerShellBehavior.ps1

      - name: Run executable behavior tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\Test-PowerShellBehavior.ps1

      - name: Run Control Center E2E
        shell: powershell
        run: .\tests\Test-ControlCenterE2E.ps1

      - name: Run Control Center visual regression
        shell: powershell
        run: .\tests\Test-ControlCenterVisual.ps1 -OutputDirectory ".\artifacts\control-center-visual"

      - name: Upload Control Center visual artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: control-center-visual
          path: artifacts/control-center-visual/
          if-no-files-found: ignore
          retention-days: 14

  pages-browser:
    name: Pages browser + accessibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Set up Python web server runtime
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Validate JavaScript syntax
        run: |
          node --check docs/app.js
          node --check playwright.config.js
          node --check tests/pages.spec.js

      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright and axe Pages tests
        run: npm run test:pages

      - name: Upload Pages visual screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pages-visual
          path: test-results/visual/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
