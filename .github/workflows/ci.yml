name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate JSON
        shell: pwsh
        run: |
          Get-Content config.json -Raw | ConvertFrom-Json | Out-Null

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              Write-Host "Syntax errors in $($_.FullName)"
              $errors | ForEach-Object { Write-Host $_ }
              $failed = $true
            }
          }

          if ($failed) {
            exit 1
          }

      - name: Verify launcher references
        shell: pwsh
        run: |
          $required = @(
            "Setup.ps1",
            "Start-PhoneMirror.ps1",
            "Stop-PhoneMirror.ps1",
            "Start-Hidden.vbs",
            "Diagnostics.ps1",
            "Remove-Autostart.ps1"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Missing required file: $file"
            }
          }

      - name: Run tests
        run: python tests\test_package.py
