name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Build, fast tests and package (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - id: version
        name: Resolve package version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-.][0-9A-Za-z.-]+)?$') {
            throw "Directory.Build.props contains invalid version '$version'."
          }

          $packageVersion = if ($env:EVENT_NAME -eq 'push' -and $env:REF_NAME -eq 'refs/heads/main') {
            $version
          } else {
            "0.0.${{ github.run_number }}"
          }

          "release_version=$version" >> $env:GITHUB_OUTPUT
          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Building installer version $packageVersion"

      - name: Build (warnings are errors)
        run: dotnet build Rex.sln -c Release

      - name: Fast tests
        run: dotnet test --project tests/Rex.Tests/Rex.Tests.csproj -c Release --no-build -- --filter-not-class Rex.Tests.AppEndToEndTests Rex.Tests.AppUiTests --long-running 60 --xunit-diagnostics on --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml --coverage-settings tests/coverage.settings.xml

      - name: Enforce complete coverage of required Core files
        shell: pwsh
        run: |
          $report = Get-ChildItem -Recurse -Filter coverage.cobertura.xml | Select-Object -First 1
          if (-not $report) { throw "The fast test run did not produce coverage.cobertura.xml." }
          [xml]$coverage = Get-Content $report.FullName -Raw
          $required = Get-Content tests/coverage-required.txt |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -and -not $_.StartsWith('#') }
          $failures = [System.Collections.Generic.List[string]]::new()
          foreach ($name in $required) {
            $classes = @($coverage.coverage.packages.package.classes.class | Where-Object {
              [IO.Path]::GetFileName([string]$_.filename) -eq $name
            })
            if ($classes.Count -eq 0) {
              $failures.Add("${name}: absent from the coverage report")
              continue
            }
            foreach ($class in $classes) {
              foreach ($line in @($class.lines.line | Where-Object { [int]$_.hits -eq 0 })) {
                $failures.Add("${name}:$($line.number) is not covered")
              }
            }
          }
          if ($failures.Count -gt 0) {
            $failures | Sort-Object -Unique | ForEach-Object { Write-Error $_ }
            throw "$($failures.Count) required coverage check(s) failed."
          }
          Write-Host "All $($required.Count) required Core files have 100% line coverage."

      - name: Build the installer
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./installer/build.ps1 -Version "${{ steps.version.outputs.package_version }}"

      - name: Smoke test the published CLI
        shell: pwsh
        run: |
          $env:REX_ROOT = (Get-Location).Path
          & dist/rex/rex.exe help
          if ($LASTEXITCODE -ne 0) { throw "rex help failed." }

          $json = & dist/rex/rex.exe agent capabilities
          if ($LASTEXITCODE -ne 0) { throw "rex agent capabilities failed." }
          $lines = @($json | Where-Object { $_ -ne "" })
          if ($lines.Count -ne 1) { throw "Machine mode must emit exactly one line." }
          $doc = $lines[0] | ConvertFrom-Json
          if (-not $doc.ok -or $doc.protocolVersion -ne 2) { throw "Machine protocol contract failed." }

          $status = (& dist/rex/rex.exe --json status) | ConvertFrom-Json
          if ($status.ok -ne $true -or $status.data.setupComplete -ne $true) { throw "rex --json status failed." }

      - name: Upload the installer and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-and-screens
          path: |
            dist/AndroidHeadlessMirror-Setup.exe
            dist/AndroidHeadlessMirror-Setup.exe.sha256
            artifacts/screens/
          if-no-files-found: ignore
          retention-days: 14

  desktop-e2e:
    name: Desktop E2E (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Rex.sln -c Release

      - name: Run desktop E2E tests
        run: dotnet test --project tests/Rex.Tests/Rex.Tests.csproj -c Release --no-build -- --filter-class Rex.Tests.AppEndToEndTests --long-running 60 --xunit-diagnostics on

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e-screens
          path: artifacts/screens/
          if-no-files-found: ignore
          retention-days: 14

  desktop-ui:
    name: Desktop UI automation (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Rex.sln -c Release

      # Every test in this suite carries its own timeout, so a window that stops answering fails
      # one test and the run carries on. The job timeout is the backstop behind that.
      - name: Run desktop UI automation tests
        run: dotnet test --project tests/Rex.Tests/Rex.Tests.csproj -c Release --no-build -- --filter-class Rex.Tests.AppUiTests --long-running 60 --xunit-diagnostics on

      # A picture of every page of the side panel, one stitched image per tab and window size,
      # so a change to the panel can be looked over whole in the uploaded artefacts.
      - name: Capture the side panel for review
        if: always()
        env:
          REX_UI_AUDIT: "1"
        run: dotnet test --project tests/Rex.Tests/Rex.Tests.csproj -c Release --no-build -- --filter-class Rex.Tests.UiAuditCapture --long-running 60

      - name: Take the website's pictures
        if: always()
        env:
          REX_SITE_SHOTS: "1"
        run: dotnet test --project tests/Rex.Tests/Rex.Tests.csproj -c Release --no-build -- --filter-class Rex.Tests.SiteScreenshots --long-running 60

      # The same five states measured on every run, against the committed baseline: a change that
      # makes the app cost more fails here, and the run's own numbers can become the new baseline.
      - name: Measure what the app costs
        if: always()
        env:
          REX_PERF: "1"
        run: dotnet test --project tests/Rex.Tests/Rex.Tests.csproj -c Release --no-build -- --filter-class Rex.Tests.CostCheck --long-running 60

      - name: Upload what the app costs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-ui-perf
          path: artifacts/perf/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-ui-screens
          path: artifacts/screens/
          if-no-files-found: ignore
          retention-days: 14

  pages:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  release:
    name: Publish a new version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, desktop-e2e, desktop-ui, pages]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: installer-and-screens
          path: release-artifact

      - name: Verify and publish the installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.windows.outputs.release_version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          installer_name="AndroidHeadlessMirror-Setup.exe"
          installer="release-artifact/dist/${installer_name}"
          checksum="${installer}.sha256"

          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping its published assets immutable."
            exit 0
          fi

          test -f "$installer"
          test -f "$checksum"
          (cd "$(dirname "$installer")" && sha256sum --check "${installer_name}.sha256")

          gh release create "$tag" "$installer" "$checksum" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes \
            --latest
