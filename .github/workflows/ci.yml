name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build, test and publish (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Rex.sln

      - name: Build (warnings are errors)
        run: dotnet build Rex.sln -c Release --no-restore

      - name: Test
        run: dotnet test --project tests/Rex.Tests/Rex.Tests.csproj -c Release --no-build

      - name: Publish the app and the CLI into one folder
        shell: pwsh
        run: |
          dotnet publish src/Rex.Mirror/Rex.Mirror.csproj -c Release -r win-x64 --self-contained true -o artifacts/rex
          dotnet publish src/Rex.Cli/Rex.Cli.csproj -c Release -r win-x64 --self-contained true -o artifacts/rex
          foreach ($exe in "RexMirror.exe", "rex.exe") {
            if (-not (Test-Path "artifacts/rex/$exe")) { throw "$exe was not produced." }
          }

      - name: Smoke test the published CLI
        shell: pwsh
        run: |
          $env:REX_ROOT = (Get-Location).Path
          & artifacts/rex/rex.exe help | Tee-Object artifacts/help.txt
          if ($LASTEXITCODE -ne 0) { throw "rex help failed." }

          $json = & artifacts/rex/rex.exe agent capabilities
          if ($LASTEXITCODE -ne 0) { throw "rex agent capabilities failed." }
          $lines = @($json | Where-Object { $_ -ne "" })
          if ($lines.Count -ne 1) { throw "Machine mode must emit exactly one line." }
          $doc = $lines[0] | ConvertFrom-Json
          if (-not $doc.ok -or $doc.protocolVersion -ne 2) { throw "Machine protocol contract failed." }

          $status = (& artifacts/rex/rex.exe --json status) | ConvertFrom-Json
          if ($status.ok -ne $true) { throw "rex --json status failed." }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rex-win-x64
          path: |
            artifacts/rex/
            artifacts/screens/
          if-no-files-found: ignore
          retention-days: 14

  pages:
    name: Pages site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate JavaScript
        run: |
          node --check docs/app.js
          node --check playwright.config.js
          node --check tests/pages.spec.js

      - name: Install test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright and axe checks
        run: npm run test:pages

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
