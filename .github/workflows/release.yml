name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Publish the app and the CLI
        shell: pwsh
        run: |
          dotnet publish src/Rex.Mirror/Rex.Mirror.csproj -c Release -r win-x64 --self-contained true -o dist/rex
          dotnet publish src/Rex.Cli/Rex.Cli.csproj -c Release -r win-x64 --self-contained true -o dist/rex
          foreach ($exe in "RexMirror.exe", "rex.exe") {
            if (-not (Test-Path "dist/rex/$exe")) { throw "$exe was not produced." }
          }

      - name: Package and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist/rex/* -DestinationPath dist/rex-win-x64.zip -Force
          $hash = (Get-FileHash dist/rex-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  rex-win-x64.zip" | Set-Content dist/rex-win-x64.zip.sha256 -Encoding ASCII

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/rex-win-x64.zip dist/rex-win-x64.zip.sha256 --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
