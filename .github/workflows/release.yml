name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  installer:
    name: Verify and build the installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build (warnings are errors)
        run: dotnet build Rex.sln -c Release

      - name: Test
        run: dotnet test --project tests/Rex.Tests/Rex.Tests.csproj -c Release --no-build

      - name: Build AndroidHeadlessMirror-Setup.exe
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./installer/build.ps1 -Version "${{ github.ref_name }}".TrimStart("v")

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: |
            dist/AndroidHeadlessMirror-Setup.exe
            dist/AndroidHeadlessMirror-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

  pages:
    name: Verify the website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages

  publish:
    name: Publish the GitHub release
    needs: [installer, pages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: installer
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/AndroidHeadlessMirror-Setup.exe dist/AndroidHeadlessMirror-Setup.exe.sha256 \
            --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
