name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example v2.0.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: meta
        name: Resolve and validate version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_VERSION"
          else
            tag="$REF_NAME"
          fi

          tag="${tag#release/}"
          if [[ "$tag" != v* ]]; then
            tag="v$tag"
          fi

          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version '$tag'. Expected a tag such as v2.0.0."
            exit 1
          fi

          project_version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          if [[ "$version" != "$project_version" ]]; then
            echo "::error::Release version $version does not match Directory.Build.props version $project_version."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  installer:
    name: Verify and build the installer
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build (warnings are errors)
        run: dotnet build Rex.sln -c Release

      - name: Test
        run: dotnet test --project tests/Rex.Tests/Rex.Tests.csproj -c Release --no-build

      - name: Build versioned installer
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./installer/build.ps1 -Version "$env:RELEASE_VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: |
            dist/AndroidHeadlessMirror-Setup.exe
            dist/AndroidHeadlessMirror-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

  pages:
    name: Verify the website
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages

  publish:
    name: Publish the GitHub release
    needs: [prepare, installer, pages]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: installer
          path: dist

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          installer="dist/AndroidHeadlessMirror-Setup.exe"

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists. Published releases are immutable."
            exit 1
          fi

          args=()
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            args+=(--target "$DEFAULT_BRANCH")
          fi

          gh release create "$RELEASE_TAG" "$installer" "$installer.sha256" --repo "${{ github.repository }}" --title "$RELEASE_TAG" --generate-notes --latest "${args[@]}"
